name: Desktop

# 与 npm 发布同一个 tag 触发：桌面安装包不进 npm，而是挂到同一个 GitHub Release 上。
# 需要重跑时用 Actions 页面的 "Re-run failed jobs"。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 打包 ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Intel mac 的 runner 标签随时可能下线；它失败了不该拖垮整个发布（其余平台照发）。
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
            experimental: true
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
    env:
      # 没有签名证书；关掉自动发现，免得在 CI 上因找不到证书而失败。
      # 这里不设 ELECTRON_SKIP_BINARY_DOWNLOAD（设了也没用——electron 44 起发行包
      # 已经不含 postinstall，那个开关只在 postinstall 里起作用）。打包要用本地的
      # electron 发行包（见 desktop/electron-builder.config.mjs 的 electronDist），
      # 而 `pnpm install` 现在不会下它，由 scripts/package.mjs 在打包前补下载
      # （约 100 MB，首次会算进「打包」那一步的耗时里）。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 一条命令里跑完：编译 → 搭应用目录 → 下自带 Node 运行时 → electron-builder。
      # 自带运行时取的是**宿主平台**的发行包，所以每个平台各跑各的。
      - name: 打包
        run: pnpm package:desktop

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb

  release:
    name: 挂到 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 用 gh 而不是第三方 action：npm 那条 Release 流程创建的东西这里一并复用。
      - name: 创建（或复用）Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" artifacts/* --clobber
