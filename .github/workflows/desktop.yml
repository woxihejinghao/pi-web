name: Desktop

# 与 npm 发布同一个 tag 触发：桌面安装包不进 npm，而是挂到同一个 GitHub Release 上。
# 需要重跑时用 Actions 页面的 "Re-run failed jobs"。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 打包 ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Intel mac 的 runner 标签随时可能下线；它失败了不该拖垮整个发布（其余平台照发）。
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos-arm64
          - os: macos-15-intel
            artifact: macos-x64
            experimental: true
          - os: ubuntu-latest
            artifact: linux-x64
          - os: windows-latest
            artifact: windows-x64
    env:
      # 没有签名证书；关掉自动发现，免得在 CI 上因找不到证书而失败。
      # 这里不设 ELECTRON_SKIP_BINARY_DOWNLOAD（设了也没用——electron 44 起发行包
      # 已经不含 postinstall，那个开关只在 postinstall 里起作用）。打包要用本地的
      # electron 发行包（见 desktop/electron-builder.config.mjs 的 electronDist），
      # 而 `pnpm install` 现在不会下它，由 scripts/package.mjs 在打包前补下载
      # （约 100 MB，首次会算进「打包」那一步的耗时里）。
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 一条命令里跑完：编译 → 搭应用目录 → 下自带 Node 运行时 → electron-builder。
      # 自带运行时取的是**宿主平台**的发行包，所以每个平台各跑各的。
      - name: 打包
        run: pnpm package:desktop

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb

  release:
    name: 挂到 GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # download-artifact 没有 upload-artifact 那个 `if-no-files-found`（传了会被静默忽略，
      # 只在日志里留一条 `Unexpected input(s)` 警告）——所以在这里显式查一次：没产物就早点炸，
      # 别让下一步的 `artifacts/*` 原样传给 gh 报一句看不懂的「找不到文件」。
      - name: 确认拿到了产物
        run: |
          shopt -s nullglob
          files=(artifacts/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "✗ 一个产物都没下载到，拒绝挂 Release"
            exit 1
          fi
          echo "✓ 拿到 ${#files[@]} 个产物："
          printf '  %s\n' "${files[@]}"

      # 用 gh 而不是第三方 action：npm 那条 Release 流程创建的东西这里一并复用。
      - name: 创建（或复用）Release 并上传安装包
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 不 checkout（产物是下下来的，不需要源码），于是工作目录里根本没有
          # git 仓库；而 gh 默认靠 git remote 判断「对哪个仓库操作」——不给 GH_REPO 就会以
          #   failed to run git: fatal: not a git repository (or any of the parent directories): .git
          # 失败，`gh release view` 与随后的 `gh release create` 一起挂在仓库解析这一步。
          # 显式给出仓库就绕开了，也省掉一次没必要的 checkout。
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" artifacts/* --clobber
